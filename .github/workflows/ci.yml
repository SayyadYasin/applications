name: CI/CD
on:
  push: { branches: [main] }
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: ts, POSTGRES_PASSWORD: ts, POSTGRES_DB: ts }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ts" --health-interval 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://ts:ts@localhost:5432/ts
      JWT_SECRET: ci-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm, cache-dependency-path: backend/package-lock.json }
      - run: npm ci
      - run: npx prisma generate
      - run: npx prisma migrate deploy
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm run seed

  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run build

  admin:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: admin } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm, cache-dependency-path: admin/package-lock.json }
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run build

  deploy:
    needs: [backend, frontend, admin]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions: { contents: read, packages: write }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - uses: docker/build-push-action@v6
        with: { context: backend, push: true, tags: "ghcr.io/${{ github.repository }}/api:${{ github.sha }}" }
      - uses: docker/build-push-action@v6
        with:
          context: frontend
          push: true
          tags: "ghcr.io/${{ github.repository }}/web:${{ github.sha }}"
          build-args: |
            NEXT_PUBLIC_API_URL=${{ vars.API_URL }}
            NEXT_PUBLIC_GOOGLE_MAPS_KEY=${{ vars.GOOGLE_MAPS_KEY }}
            NEXT_PUBLIC_GOOGLE_CLIENT_ID=${{ vars.GOOGLE_CLIENT_ID }}
      - uses: docker/build-push-action@v6
        with:
          context: admin
          push: true
          tags: "ghcr.io/${{ github.repository }}/admin:${{ github.sha }}"
          build-args: VITE_API_URL=${{ vars.API_URL }}
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          script: cd /opt/townservices && ./deploy.sh ${{ github.sha }}
