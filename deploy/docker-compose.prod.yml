# Production stack: pulls prebuilt images from GHCR (built by CI); Caddy terminates TLS.
# Usage: ./deploy.sh <image-tag>
services:
  db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      retries: 10

  api:
    image: ghcr.io/${GITHUB_REPO}/api:${IMAGE_TAG}
    restart: always
    env_file: .env.prod
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      NODE_ENV: production
    depends_on:
      db: { condition: service_healthy }

  web:
    image: ghcr.io/${GITHUB_REPO}/web:${IMAGE_TAG}
    restart: always
    depends_on: [api]

  admin:
    image: ghcr.io/${GITHUB_REPO}/admin:${IMAGE_TAG}
    restart: always
    depends_on: [api]

  caddy:
    image: caddy:2-alpine
    restart: always
    ports: ["80:80", "443:443"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    environment:
      DOMAIN: ${DOMAIN}
    depends_on: [api, web, admin]

volumes:
  pgdata:
  caddy_data:
