services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: townservices
      POSTGRES_PASSWORD: townservices
      POSTGRES_DB: townservices
    volumes: [pgdata:/var/lib/postgresql/data]
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U townservices"]
      interval: 5s
      retries: 10

  api:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql://townservices:townservices@db:5432/townservices
    depends_on:
      db: { condition: service_healthy }
    ports: ["4000:4000"]

  web:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:4000/api/v1
    depends_on: [api]
    ports: ["3000:3000"]

  admin:
    build:
      context: ./admin
      args:
        VITE_API_URL: http://localhost:4000/api/v1
    depends_on: [api]
    ports: ["5173:80"]

volumes:
  pgdata:
